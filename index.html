<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Welcome - Telegram Channel</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #071a08;
      color: white;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      text-align: center;
      padding: 30px 22px;
      border-radius: 24px;
      background: rgba(10, 35, 12, 0.96);
      box-shadow: 0 0 35px rgba(0, 255, 50, 0.25);
      border: 1px solid rgba(0, 255, 50, 0.25);
    }

    .logo {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 50%;
      margin: 0 auto 22px;
      display: block;
      box-shadow: 0 0 30px rgba(0, 255, 40, 0.55);
    }

    h1 {
      font-size: 27px;
      line-height: 1.25;
      margin-bottom: 12px;
    }

    .subtitle {
      color: #c9d8ca;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .countdown {
      margin: 20px auto;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 5px solid #38ff4b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: bold;
      color: #fff;
      box-shadow: 0 0 22px rgba(56, 255, 75, 0.5);
    }

    .join-btn {
      display: inline-block;
      width: 100%;
      padding: 15px 20px;
      border-radius: 12px;
      background: #20c967;
      color: white;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      transition: 0.2s;
    }

    .join-btn:hover {
      transform: scale(1.02);
      background: #18b85a;
    }

    .footer {
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1px solid rgba(255,255,255,0.12);
      font-size: 13px;
      color: #9faea0;
    }

    .footer a {
      color: #42ff68;
      text-decoration: none;
      font-weight: bold;
    }

    .notice {
      margin-top: 15px;
      font-size: 12px;
      color: #8f9b90;
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- Replace logo.jpg with your uploaded image filename -->
    <img src="logo.jpg" alt="Channel Logo" class="logo">

    <h1>Welcome to Our Telegram Channel</h1>

    <p class="subtitle">
      Join our official Telegram community and stay updated with the latest posts.
    </p>

    <div class="countdown" id="countdown">5</div>

    <a
      href="https://t.me/+kuhpEFNPZwE0MzU1"
      class="join-btn"
      id="joinButton"
      target="_blank"
      rel="noopener noreferrer">
      JOIN NOW
    </a>

    <p class="notice">
      Please review the channel information before joining.
    </p>

    <div class="footer">
      Ads run by
      <a href="https://t.me/NXR_ERRA"
         target="_blank"
         rel="noopener noreferrer">
        @YOUR_USERNAME
      </a>
    </div>

  </main>

  <script>
    let seconds = 5;
    const countdown = document.getElementById("countdown");

    const timer = setInterval(function () {
      seconds--;

      if (seconds >= 0) {
        countdown.textContent = seconds;
      }

      if (seconds <= 0) {
        clearInterval(timer);
      }
    }, 1000);
  </script>

</body>
</html>
